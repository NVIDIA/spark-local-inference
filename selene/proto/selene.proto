// Selene pool protocol, version 2 (package selene.v2).
//
// The wire contract between an instance's in-process pool client (crate `selene`)
// and `selene-manager`. PROTOCOL.md defines the state machines; this file is
// normative for field numbers, field meaning and the invariants stated in the
// comments. A field comment that says "must" is checked by the receiver and a
// violation fails the message (see each message) rather than being repaired.
//
// Shape of the contract
//   * `Hello` (unary) is the stateless first call: protocol version, the
//     manager's declared encryption, readiness, limits, incarnation.
//   * `Session` (one bidirectional stream per instance process and scope) carries
//     everything else. The stream gives a total order in each direction; every
//     other ordering rule below is stated on top of it.
//   * An instance plays up to three roles on its one session: SOURCE (publishes
//     index notices and serves export requests), REQUESTER (looks up, claims and
//     copies) and WRITER (spills records into the manager's store with Put).
//   * The manager never holds document content in its index. Payload moves only
//     through manager-granted shared-memory windows (same host) or the data
//     channel (other hosts); never in gRPC messages.
//
// Identifiers
//   manager_incarnation  64-bit, random and nonzero, chosen once per manager
//                        process start. Clients compare for equality only.
//   session_incarnation  64-bit, assigned by the manager in SessionOpened from a
//                        counter that never repeats within one manager
//                        incarnation. A new Session by the same instance_id
//                        supersedes the old one (newer incarnation wins).
//   instance_id          16 bytes, STABLE across restarts. Derived by
//                        `selene::pool::instance_id` (crate `flare-selene`,
//                        src/pool/identity.rs), which documents the byte layout:
//                        BLAKE2b-128 over "selene-instance-v2", then the pool name,
//                        the model identity, the layout fingerprint and the GPU
//                        UUIDs in ascending byte order, each preceded by its
//                        length as a little-endian u32. Instances on one host use
//                        disjoint GPUs, so it is unique per host; a restarted
//                        instance gets the same id. The manager only compares it;
//                        it never recomputes it.
//   process_nonce        16 random bytes chosen by the client at process start
//                        (OpenSession.process_nonce). Tells two processes with
//                        one instance_id apart; unchanged across a reconnect of
//                        the same process.
//   claim_id / put_id    chosen by the requester/writer, strictly increasing and
//                        never reused within one (instance_id, process_nonce).
//                        A claim is named (instance_id, process_nonce, claim_id)
//                        so that fencing acknowledgments still resolve after the
//                        session that created the claim was replaced by a
//                        reconnect of the SAME process. A new process (new
//                        nonce) starts its counters afresh and can attest
//                        nothing for its predecessor.
//   export_id            assigned by the manager, unique within one manager
//                        incarnation. One export request per claim.

syntax = "proto3";
package selene.v2;

service Pool {
  // Stateless. Safe to retry. Never changes manager state.
  rpc Hello(HelloRequest) returns (HelloReply);
  // The data-only attachment of one peer rank of a multi-process instance
  // (tensor-parallel ranks that are separate processes). One stream per agent
  // process. See "Rank agents" below.
  rpc Rank(stream RankClientMessage) returns (stream RankServerMessage);
  // Exactly one live Session per instance_id per manager incarnation. The first
  // ClientMessage must be `open`; the first ServerMessage is `opened`.
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

// ---------------------------------------------------------------------------
// Vocabulary shared with the v1 contract
// ---------------------------------------------------------------------------

// A prefix identity: the number of tokens consumed and the 16-byte digest of
// the token and conditioning history up to that point. Same meaning as Flare's
// `PrefixKey`. `digest` must be exactly 16 bytes.
message PrefixKey {
  uint64 consumed_tokens = 1;
  bytes digest = 2;
}

// Bytes per page and per state row for one rank. Same meaning as v1.
message RankPlanes {
  repeated uint64 plane_bytes = 1;
  uint64 row_bytes = 2;
}

// The record geometry of one model core on one rank layout.
message Geometry {
  // Tokens per KV page. Nonzero.
  uint64 page_tokens = 1;
  // One entry per tensor-parallel rank, in rank order. A different rank count
  // or per-rank plane list is a different geometry and a different scope.
  repeated RankPlanes ranks = 2;
  // Bytes of one page record (all ranks) and of one row record (all ranks).
  // Both must be nonzero multiples of 4096, so every window length is too.
  uint64 page_record_bytes = 3;
  uint64 row_record_bytes = 4;
}

// What a session may share. Records are only ever shared between sessions with
// byte-identical scopes. A manager keeps one index per scope_id.
message Scope {
  // 32-byte model core identity (weights, recipe and tokenizer).
  bytes model_identity = 2;
  // 16-byte fingerprint of the cache layout (page size, plane order, dtype).
  bytes layout_fingerprint = 3;
  // Rank geometry. Checked against `layout_fingerprint` only for internal
  // consistency of page_record_bytes and row_record_bytes; the manager does not
  // interpret layouts.
  Geometry geometry = 4;
}
// scope_id is derived by `selene::pool::scope_id` (crate `flare-selene`,
// src/pool/identity.rs), which documents the byte layout: BLAKE2b-256 over
// "selene-scope-v2", the model identity, the layout fingerprint, the pool name as one
// length byte then its bytes, and the canonical bytes of `geometry` (all integers
// little-endian). The manager calls that function from the same crate and
// SessionOpened echoes its value; the client must compare it with its own.

// Where a copy of a record lives, from the source's point of view.
enum Tier {
  TIER_UNSPECIFIED = 0;
  GPU = 1;    // an instance's GPU checkpoint cache. Exportable only by that instance.
  DRAM = 2;   // an instance's or the manager's host DRAM.
  NVME = 3;   // an instance's or the manager's NVMe.
}

// The copy-priority level of a candidate from the requester's perspective
// (design table "Tier priority for copies"). The numbering is the default
// order.
enum Level {
  LEVEL_UNSPECIFIED = 0;
  THIS_GPU = 1;        // never offered as a candidate.
  NEIGHBOUR_GPU = 2;   // Tier GPU in another instance on the same host.
  HOST_DRAM = 3;       // Tier DRAM: own, a neighbour's, or a same-host manager's (its DRAM is level 3).
  HOST_NVME = 4;       // Tier NVME: own, a neighbour's, or a same-host manager's.
  REMOTE_NVME = 5;     // Anything a manager on another host serves (its NVMe, and its DRAM too).
}

enum Encryption {
  ENCRYPTION_UNSPECIFIED = 0;
  PLAINTEXT = 1;
  TLS = 2;
}

enum DataTransport {
  DATA_TRANSPORT_UNSPECIFIED = 0;
  TCP = 1;
  RDMA = 2;
}

// Where payload for a claim or a put moves.
enum CopyMode {
  COPY_MODE_UNSPECIFIED = 0;
  // Through manager-granted windows in the shared-memory regions. Only valid on
  // a session whose `shared_memory` was given in HelloReply (same host).
  SHARED_WINDOWS = 1;
  // Through the data channel named in the grant. Valid on any session; required
  // when the session has no shared memory.
  DATA_CHANNEL = 2;
}

enum Region { REGION_UNSPECIFIED = 0; ARENA = 1; STAGING = 2; }

// ---------------------------------------------------------------------------
// Hello
// ---------------------------------------------------------------------------

message HelloRequest {
  // The client's protocol version. This contract is 2.
  uint32 protocol = 1;
}

enum HelloStatus {
  HELLO_STATUS_UNSPECIFIED = 0;
  HELLO_OK = 1;
  // The manager does not speak `protocol`. Only `status` and `protocol` of the
  // reply are meaningful. The client logs one warning and uses local tiers only;
  // it does not retry until restarted.
  VERSION_MISMATCH = 2;
}

message HelloReply {
  HelloStatus status = 1;
  // The manager's protocol version.
  uint32 protocol = 2;
  // See the header. A client that sees a different value on a later Hello or in
  // a ServerMessage header knows the manager restarted: it must treat every
  // claim, export, window and session from the old incarnation as lost (the
  // fencing rules in PROTOCOL.md apply) and open a new session.
  uint64 manager_incarnation = 3;
  // The encryption the manager was launched with. The client must require
  // `declared == connected_with`; any other result disables the pool for this
  // process. A client with a CA configured never accepts PLAINTEXT, so a
  // downgrade is refused before any Session starts.
  Encryption encryption = 4;
  ReadinessInfo readiness = 5;
  // Offered data channels. RDMA is never offered when encryption is TLS.
  repeated DataTransport data_transports = 6;
  Limits limits = 7;
  // Present only when the connection is a Unix-domain socket whose peer
  // credentials match the manager's (same host, same uid and gid). Absent
  // otherwise, and the client must then use DATA_CHANNEL for every copy.
  SharedMemory shared_memory = 8;
  string pool_name = 10;
}

// Every limit is enforced by the manager. A request beyond a limit is refused
// with the reason named on that request, or fails the session if the limit is
// structural (batch sizes). All counts are per session unless stated.
message Limits {
  uint32 max_concurrent_lookups = 1;    // default 8
  uint32 max_candidates = 2;            // per LookupReply; default 8
  uint32 max_chain_nodes = 3;           // per candidate and per Record list; default 4096
  uint32 max_boundaries = 4;            // per LookupRequest; default 8192
  uint32 max_notices_per_batch = 5;     // default 256
  uint32 max_resync_chunk_entries = 7;  // default 1024
  uint32 max_resync_entries = 8;        // per session snapshot; default 4 million
  uint32 max_claims_in_flight = 10;     // per requester; default 2 (design: per-GPU export limit)
  uint32 max_export_slots = 11;         // upper bound on OpenSession.export_slots; default 2
  uint32 window_credits = 12;           // unreleased windows per claim or put; default 2
  uint64 max_window_bytes = 13;         // a window is whole pages and/or the row; default 4 MiB.
                                        // A single page or the row may exceed it as a window of its own.
  uint32 max_claim_deadline_ms = 14;    // clamp on claim setup allowance; default 30000
  uint32 pin_deadline_ms = 15;          // how long a source has to answer ExportRequest; default 250
  uint32 progress_timeout_ms = 16;      // no window fill/release for this long expires a claim; default 3000
  uint32 max_open_puts = 17;            // per writer; default 4
}

// Mapped MAP_SHARED by the client at these paths. The files persist across
// manager restarts: a restarted manager with the same configured sizes reopens
// the same files, so their paths, sizes and offsets are unchanged and
// `regions_generation` is unchanged. When it has to recreate them (a size
// changed, or a file was unusable) it chooses a new generation. A client maps
// and registers the regions once, at startup, and keeps them for the life of the
// process; a different generation on a later Hello means its mappings are of
// files that no longer back the pool, so it uses the pool no more until it is
// restarted. The client must not create, truncate or unlink these files.
message SharedMemory {
  string arena_path = 1;
  uint64 arena_bytes = 2;
  string staging_path = 3;
  uint64 staging_bytes = 4;
  // Nonzero. Identifies this set of region files; see above.
  uint64 regions_generation = 5;
}

enum ReadinessState {
  READINESS_UNSPECIFIED = 0;
  // Lookups, claims and puts are served.
  READY = 3;
  // The manager is shutting down: new lookups, claims and puts are refused with
  // NOT_READY; claims in flight run to a terminal state.
  DRAINING = 4;
}

message ReadinessInfo {
  ReadinessState state = 1;
}

// ---------------------------------------------------------------------------
// Session envelope
// ---------------------------------------------------------------------------

// Carried on every message after `open`/`opened`. The receiver rejects a message
// whose manager_incarnation differs from its own. The manager additionally
// rejects (and closes the stream for) a message whose session_incarnation is not
// the instance's current session, except for the fence-class messages listed in
// PROTOCOL.md (FenceAck, ExportEnd, WindowReleased, ClaimRelease), which are
// resolved by (instance_id, process_nonce, id) and accepted from any current
// session of that same process. A session of a different process never attests
// for another process's accesses.
message Header {
  uint64 manager_incarnation = 1;
  uint64 session_incarnation = 2;
}

message ClientMessage {
  Header header = 1;   // unset only on `open`.
  oneof m {
    OpenSession open = 2;
    Goodbye goodbye = 3;

    // Source role: index.
    ResyncBegin resync_begin = 10;
    ResyncChunk resync_chunk = 11;
    ResyncEnd resync_end = 12;
    NoticeBatch notices = 13;

    // Requester role.
    LookupRequest lookup = 20;
    LookupCancel lookup_cancel = 21;
    Claim claim = 22;
    ClaimRelease claim_release = 23;
    WindowReleased window_released = 24;
    CopyResult copy_result = 25;
    FenceAck fence_ack = 26;

    // Source role: exports.
    PinAck pin_ack = 30;
    WindowFilled window_filled = 31;
    ExportEnd export_end = 32;

    // Writer role.
    PutBegin put_begin = 40;
    PutFilled put_filled = 41;
    PutCommit put_commit = 42;
    PutCancel put_cancel = 43;
  }
}

message ServerMessage {
  Header header = 1;
  oneof m {
    SessionOpened opened = 2;
    SessionClosing closing = 3;
    ReadinessInfo readiness = 4;     // pushed on every state change.

    // Index.
    ResyncRequired resync_required = 10;
    ResyncAck resync_ack = 11;

    // Requester role.
    LookupReply lookup_reply = 20;
    ClaimGranted claim_granted = 21;
    WindowReady window_ready = 22;
    ClaimTerminal claim_terminal = 23;

    // Source role.
    ExportRequest export_request = 30;
    ExportFill export_fill = 31;
    ExportCancel export_cancel = 32;

    // Writer role.
    PutAccept put_accept = 40;
    PutGrant put_grant = 41;
    Stored stored = 42;
    PutRefused put_refused = 43;
  }
}

// ---------------------------------------------------------------------------
// Session open and close
// ---------------------------------------------------------------------------

message OpenSession {
  // From the HelloReply the client just read. If it no longer matches the
  // manager's, the reply is STALE_MANAGER and the client redoes Hello.
  uint64 manager_incarnation = 1;
  // 16 bytes, stable across restarts, derived as described in the header. A Session
  // whose instance_id already has a live session replaces it: the newer
  // incarnation wins and the older session is fenced (SessionClosing SUPERSEDED;
  // its claims fail, its windows stay quarantined until its process is confirmed
  // exited, its pins are not attestable). The older session's entries are not
  // offered from that moment and are replaced atomically when the newer session's
  // snapshot installs.
  bytes instance_id = 2;
  Scope scope = 4;
  // 16 random bytes, fresh per process, constant across reconnects of the same
  // process. Same nonce on a second Session = reconnect of one process (fence-class
  // messages of the old stream stay valid); a different nonce = another process.
  bytes process_nonce = 7;
  // How many exports this instance can serve at once: the per-GPU export count
  // (default 2). 0 means this instance serves no exports (it publishes no GPU
  // or host entries as exportable and is requester/writer only). The manager
  // grants min(this, Limits.max_export_slots) and never has more exports
  // outstanding to the instance than that.
  uint32 export_slots = 5;
  // How many claims this instance wants in flight; granted as
  // min(this, Limits.max_claims_in_flight). 0 means requester role off.
  uint32 claim_slots = 6;
  // 32 random bytes. Non-empty marks a multi-process instance: its tensor-parallel
  // ranks are separate processes, `scope.geometry.ranks` has one entry per rank (at
  // least two), and this session is rank 0. Rank 0 alone decides (looks up, claims,
  // puts, answers exports); each other rank attaches with `Rank` using this secret
  // and moves only its own slice. See "Rank agents".
  bytes rank_secret = 8;
}

enum OpenStatus {
  OPEN_STATUS_UNSPECIFIED = 0;
  OPEN_OK = 1;
  STALE_MANAGER = 2;     // manager_incarnation does not match.
  INVALID_SCOPE = 3;     // malformed scope or geometry (sizes not multiples of 4096).
  SHUTTING_DOWN = 4;
}

message SessionOpened {
  OpenStatus status = 1;
  // Fresh for this session. Messages that carry an older value are stale.
  uint64 session_incarnation = 2;
  bytes scope_id = 3;
  uint32 export_slots = 4;
  ReadinessInfo readiness = 6;
}

// Orderly close from the client. After sending it the client sends nothing more.
message Goodbye {
  // True only if every window, GPU pin, staging buffer and data-channel
  // registration THIS session used has provably stopped being accessed by this
  // process (the fencing rules of PROTOCOL.md). It clears only this party's
  // obligations: a window the opposite party (requester or source of the same
  // claim) may still access is reclaimed only after that party has drained too.
  // False: the manager treats the close like a disconnect (quarantine until the
  // process is confirmed gone). A source must have sent ExportEnd for every
  // export before Goodbye{quiesced=true}; a quarantined export keeps its pin
  // and makes quiesced false.
  bool quiesced = 1;
}

enum ClosingReason {
  CLOSING_REASON_UNSPECIFIED = 0;
  CLOSING_SUPERSEDED = 1;   // the same instance_id opened a newer session (reconnect or another process; the newer wins).
  CLOSING_SHUTDOWN = 2;
  CLOSING_PROTOCOL_VIOLATION = 3;
  CLOSING_STALE_SESSION = 4;
}

// The manager is closing this stream. Everything this session owned is treated
// as in PROTOCOL.md "Session loss". The client stops submitting, drains, then
// reconnects (new Hello, new Session, resync).
message SessionClosing {
  ClosingReason reason = 1;
  string detail = 2;
}


// ---------------------------------------------------------------------------
// Index: entries, notices, resync
// ---------------------------------------------------------------------------

// One (key, tier) holding in a source. Entries are hints: every claim is
// revalidated at the source.
message IndexEntry {
  PrefixKey key = 1;
  bool has_parent = 2;
  // The key of the previous record in the source's chain at this tier. Absent
  // at the root. After a compaction the heir's parent is the compacted node's
  // parent.
  PrefixKey parent = 3;
  // 16 bytes: digest of the aligned hash-block boundary at or below `key`.
  bytes bucket = 4;
  // Pages this record owns (its tail), not the whole chain.
  uint32 tail_pages = 5;
  // The record carries the state row, so it can end a restore.
  bool row = 6;
  Tier tier = 7;
  // Payload bytes of this record, excluding any envelope.
  uint64 bytes = 9;
}

message Notice {
  oneof kind {
    Saved saved = 1;
    Spilled spilled = 2;
    Evicted evicted = 3;
  }
}

// A holding appeared (publication to the GPU cache, a host write completing).
// Upsert by immutable content key and tier. A record whose write has not
// completed must not be announced.
message Saved { IndexEntry entry = 1; }

// A holding moved down the eviction cascade atomically: `to` is added and the
// holding at `from_tier` is removed, so the manager never
// sees a moment with neither. `to.tier` must be a tier below `from_tier`.
message Spilled {
  IndexEntry to = 1;
  Tier from_tier = 2;
}

enum EvictKind {
  EVICT_KIND_UNSPECIFIED = 0;
  // The node left the cache (a leaf). Page-only ancestors that left with it are
  // separate Evicted notices, one per node; the manager never cascades.
  REMOVED = 1;
  // The node stopped being an endpoint but its pages live on in its single
  // child. `heir` is the child's updated entry (same key, new
  // parent and tail_pages).
  COMPACTED = 2;
}

// Remove the content key and tier hint. A late eviction may cause a miss.
message Evicted {
  PrefixKey key = 1;
  Tier tier = 2;
  EvictKind kind = 4;
  IndexEntry heir = 5;   // present iff kind == COMPACTED.
}

// The ordered stream carries snapshot chunks before later notices. Begin clears
// the source's hints; chunks upsert live, so lookups may see a partial snapshot.
message NoticeBatch { repeated Notice notices = 2; }
message ResyncBegin { }
message ResyncChunk { repeated IndexEntry entries = 3; }
message ResyncEnd { }
message ResyncAck { }
enum ResyncReason {
  RESYNC_REASON_UNSPECIFIED = 0;
  RESYNC_STATE_LOST = 1;
  RESYNC_OVERFLOW = 3;
}
message ResyncRequired { ResyncReason reason = 1; }

// ---------------------------------------------------------------------------
// Lookup
// ---------------------------------------------------------------------------

message LookupRequest {
  // Unique per session among live lookups; chosen by the client.
  uint64 lookup_id = 1;
  // The aligned hash-block boundary keys of the history, ascending by
  // consumed_tokens, starting with the root key (consumed_tokens 0 is allowed).
  // At most Limits.max_boundaries: if the history has more, the client sends the
  // root and the deepest boundaries. The manager probes buckets by digest.
  repeated PrefixKey boundaries = 2;
  // Candidates must end strictly below this many tokens (the same meaning as
  // `before` in Flare's lookup, capped at the history length).
  uint64 before_tokens = 3;
  // The exact end of the GPU-resident prefix.
  uint64 resident_tokens = 7;
}

message LookupCancel { uint64 lookup_id = 1; }

enum LookupStatus {
  LOOKUP_STATUS_UNSPECIFIED = 0;
  LOOKUP_OK = 1;          // possibly with no candidates.
  LOOKUP_NOT_READY = 2;   // readiness is not READY; retry_after_ms hints when.
  LOOKUP_OVERLOADED = 3;  // max_concurrent_lookups or the manager's lookup work bound hit.
  LOOKUP_INVALID = 4;     // limits exceeded, boundaries not ascending, invalid boundaries.
}

message ChainNode {
  PrefixKey key = 1;
  uint32 tail_pages = 2;
  bool row = 4;
}

// One place the requester could restore from. Rules the manager applies
// (design "Rules" 1, 3 and 5):
//  * the requester's own instance is never a source;
//  * candidates begin at resident_tokens; physical pages use its floor to a
//    page boundary. Endpoints must extend the resident prefix.
//  * replies are ordered by longest match, then fixed copy level.
// Everything here is a hint. The client re-checks every node against its own
// history (`key == history.key_at(key.consumed_tokens)`) and drops a candidate
// that fails.
message Candidate {
  Level level = 1;
  Tier tier = 2;
  SourceRef source = 3;
  // The endpoint (the deepest record).
  PrefixKey key = 4;
  // Exact resident token count. Its floor to a page is the physical start.
  uint64 begin_tokens = 6;
  // Pages and bytes the candidate supplies from begin_tokens to the endpoint,
  // and whether it supplies the endpoint row.
  uint64 pages = 7;
  uint64 bytes = 8;
  bool row = 9;
  // Records from the one containing begin_tokens up to the endpoint, ascending.
  // At most Limits.max_chain_nodes.
  repeated ChainNode nodes = 10;
  // Pages of nodes[0]'s tail that precede the physical start (Match.skip_pages).
  uint32 skip_pages = 11;
}

// A source is an instance (instance_id non-empty) or the manager's own store
// (instance_id empty).
message SourceRef {
  bytes instance_id = 1;
  // Session the entry was announced in. A claim naming a session that is no
  // longer the instance's current one is refused STALE_SOURCE.
  uint64 session_incarnation = 2;
}

message LookupReply {
  uint64 lookup_id = 1;
  LookupStatus status = 2;
  // At most the requested max_candidates, in the order stated on Candidate.
  repeated Candidate candidates = 3;
  uint32 retry_after_ms = 4;
}

// ---------------------------------------------------------------------------
// Claim
// ---------------------------------------------------------------------------

// Ask to restore [begin_tokens, key.consumed_tokens) of one chain from one
// source. The manager forwards it to the source; the source (not the manager)
// validates the chain and pins it.
message Claim {
  // Strictly increasing within (instance_id, process_nonce), never reused.
  uint64 claim_id = 1;
  SourceRef source = 3;
  Tier tier = 4;
  // Endpoint key, as in the Candidate.
  PrefixKey key = 5;
  // The logical split: the exact consumed_tokens up to which the requester
  // already holds (its resident prefix). Not required to be page-aligned and >= the
  // candidate's begin_tokens. The source supplies the pages from
  // floor(begin_tokens / page_tokens) to floor(key.consumed_tokens /
  // page_tokens) and, if want_row, the endpoint row. When both floors are equal
  // there are zero pages and only the row (a row-only tail). Both the logical
  // split and the physical page offset are validated: begin_tokens <=
  // key.consumed_tokens, and the chain is contiguous from the physical offset.
  uint64 begin_tokens = 7;
  // Whether the endpoint row is wanted.
  bool want_row = 8;
  CopyMode mode = 9;
  // Setup allowance from the manager's receipt, clamped to
  // Limits.max_claim_deadline_ms; 0 means the limit. The manager adds
  // the claimed bytes divided by a conservative 8 MiB/s transfer rate.
  uint32 deadline_ms = 10;
}

// What the source pinned, record by record, in restore order. For a data-channel
// copy this is also the order bytes arrive.
message Record {
  PrefixKey key = 1;
  // Record-relative page index where this claim's pages start in the record's
  // tail (non-zero only for the first record: Match.skip_pages /
  // FetchSegment.first_page).
  uint32 first_page = 3;
  // Pages this claim takes from the record (tail_pages - first_page for a full
  // take). May be 0 only for a row-only record, which must be the last.
  uint32 pages = 4;
  // True only on the last record, and only if the claim wanted the row.
  bool row = 5;
}

// The manager's single authoritative per-claim state (PROTOCOL.md). Only the
// terminal values travel in ClaimTerminal; the others describe manager state.
enum ClaimState {
  CLAIM_STATE_UNSPECIFIED = 0;
  REQUESTED = 1;       // accepted by the manager; ExportRequest sent (or internal pin started).
  GRANTED = 3;         // grant sent to the requester. Equivalent to the hold being granted.
  COPIED = 5;          // terminal: the requester validated and drained its writes.
  FAILED = 6;          // terminal.
}

enum ClaimReason {
  CLAIM_REASON_UNSPECIFIED = 0;
  REASON_NONE = 1;            // COPIED.
  // Refusals at the manager, answered at once with FAILED:
  NOT_READY = 2;
  CLAIM_LIMIT = 3;            // the requester already has claim_slots claims in flight.
  SOURCE_LIMIT = 4;           // the source already has export_slots exports outstanding.
  UNKNOWN_SOURCE = 5;         // no such source or entry in the manager's index.
  STALE_SOURCE = 6;           // the named source session is not the instance's current one.
  INVALID_CLAIM = 7;          // malformed, begin beyond key, a reused or non-increasing claim_id, mode not allowed.
  NO_WINDOWS = 8;             // staging exhausted or quarantined; not "no headroom at the source".
  // Refusals at the source, relayed immediately:
  NOT_FOUND = 9;              // the source no longer holds the key at that tier.
  CHAIN_GAP = 11;             // the chain is not contiguous from begin_tokens to the endpoint.
  NO_HEADROOM = 12;           // GPU headroom check failed (immediate; never waits).
  SOURCE_BUSY = 13;           // the source's own export limit or pin failure.
  SOURCE_TIMEOUT = 14;        // no PinAck within pin_deadline_ms.
  // Failures after the pin:
  SOURCE_LOST = 15;           // the source session ended.
  REQUESTER_LOST = 16;        // the requester session ended.
  CANCELLED = 17;             // the requester released the claim before COPIED.
  COPY_ERROR = 18;            // a read, write or transport error reported by either side.
  CHECKSUM = 19;              // the requester's end-to-end check failed.
  CLAIM_MANAGER_SHUTDOWN = 20;
  DEADLINE = 21;              // with state FAILED.
  NO_PROGRESS = 22;           // with state FAILED.
  UNKNOWN_CLAIM = 23;         // the manager has no such claim (after a manager restart, or a late release).
  RANKS_DETACHED = 24;        // a peer rank of a multi-process instance is not attached (refused at once).
  RANK_LOST = 25;             // an attached peer rank's stream ended during the transfer.
  REGIONS_HELD = 26;          // the manager restarted and still holds its shared regions for the previous run's
                              // processes (PROTOCOL.md 8.6); refused at once. Retry shortly: it ends as soon
                              // as they have reconnected.
}

// Hold granted. Sent only after the source's PinAck (for a manager-store source,
// after the manager's own pin). This message is the hold: from here until the
// claim is terminal and fenced, the source copy is protected from eviction.
// It does not protect against the source dying.
message ClaimGranted {
  uint64 claim_id = 1;
  // What was pinned, in restore order. At most Limits.max_chain_nodes. The
  // requester must verify it against its own history and plan (keys, first_page,
  // and that the pages sum to what it expects) and abandon the claim with
  // CopyResult{ABANDONED} otherwise.
  repeated Record records = 2;
  uint64 total_pages = 3;
  bool row = 4;
  // For SHARED_WINDOWS, windows follow as WindowReady messages. For
  // DATA_CHANNEL, `channel` is set instead and no WindowReady is sent.
  DataChannelRef channel = 5;
  // Unreleased-window credit for this claim (Limits.window_credits). Meaningful
  // only when `retained` is false, which happens only for host-tier sources.
  uint32 window_credits = 6;
  // True when separately retained staging for the whole claim was reserved: every
  // window is issued at once and the source's pin ends when its last window is
  // filled, independent of the requester's pace. ALWAYS true for a GPU-tier
  // source: a GPU export is accepted only after staging for the whole export is
  // reserved (by the manager before the ExportRequest, from the index's size, and
  // checked by the source against the actual chain), else refused NO_WINDOWS at
  // once. A host-tier source (DRAM, NVMe) may stream with credits.
  bool retained = 7;
  // A multi-process requester: the channel of each peer rank that is in channel mode
  // (rank 0's is `channel`).
  repeated RankChannel rank_channels = 8;
}

// Where a data-channel transfer is served. The byte framing of the channel is
// the data-plane contract (not part of this file). The invariants here hold for
// every framing: the transfer is named by (claim_id or put_id, token); the token
// is single-use, bound to one instance_id, and expires with the claim; payload
// arrives in the order of `records` with per-page and row xxh3 checksums the
// requester verifies before use; the manager side ends the transfer when the
// claim becomes terminal.
message DataChannelRef {
  DataTransport transport = 1;
  string address = 2;       // host:port of the manager's data listener.
  bytes token = 3;          // opaque, 32 bytes.
}

// A window in a manager-owned region. All offsets and lengths are multiples of
// 4096. Neither side may touch bytes outside [offset, offset + length), nor keep
// using a window after releasing or filling it (see ownership in PROTOCOL.md).
message WindowSpec {
  uint32 index = 1;          // ordinal within the claim or put, from 0, without holes.
  Region region = 2;
  uint64 offset = 3;
  uint64 length = 4;
  uint32 record = 5;         // index into ClaimGranted.records.
  // Record-relative first page and page count carried; the pages are the claim's
  // pages of that record in order. page_count is 0 only for a row-only window.
  uint32 first_page = 6;
  uint32 page_count = 7;
  // The window carries the row after its pages (or alone). Only in the window
  // that completes the last record.
  bool row = 8;
}
// length == page_count * Geometry.page_record_bytes + (row ? row_record_bytes : 0).

// A window the source filled and the requester may now read. The checksums are
// the source's and the requester verifies them after copying out. For a DRAM or
// NVMe source they MUST be the checksums persisted with the record when it was
// committed (never hashes of the bytes just read, which would legitimize at-rest
// corruption). Only a GPU source, which has no stored checksum, computes them
// from the bytes it wrote.
message WindowReady {
  uint64 claim_id = 1;
  WindowSpec window = 2;
  repeated uint64 page_xxh3 = 3;   // one per page, in order.
  uint64 row_xxh3 = 4;
  bool has_row = 5;
  // A multi-process requester: each rank's slice transfer checksums, computed by the
  // manager in one pass with its verification of the stored sums. `page_xxh3` and
  // `row_xxh3` are then empty.
  repeated RankSums rank_sums = 6;
}

// The requester finished reading the window: every copy that read it has
// drained (the CUDA stream or event reached, the memcpy returned). Returns one
// credit. Idempotent. Never sent earlier than the drain.
message WindowReleased {
  uint64 claim_id = 1;
  uint32 index = 2;
}

// The requester's verdict, sent once, only after every access it made has
// drained and every page and row was verified. The only way to reach COPIED.
// `ABANDONED` means it did not use the grant (plan failed elsewhere, mismatched
// records). Idempotent; the first terminal transition of the claim wins.
enum CopyOutcome {
  COPY_OUTCOME_UNSPECIFIED = 0;
  COPY_OK = 1;
  COPY_CHECKSUM = 2;
  COPY_ERROR_OUTCOME = 3;
  COPY_ABANDONED = 4;
}
message CopyResult {
  uint64 claim_id = 1;
  CopyOutcome outcome = 2;
}

// Cancel or release, whichever applies. Idempotent. Before the claim is
// terminal it drives FAILED{CANCELLED} (including a claim whose grant has not
// arrived, and a late grant: PROTOCOL.md "Late grant"). After it is terminal
// it does nothing. Unknown claim_id is answered with ClaimTerminal
// {FAILED, UNKNOWN_CLAIM}. Resolved by (instance_id, process_nonce, claim_id), so it is
// accepted from any current session of the same instance.
message ClaimRelease { uint64 claim_id = 1; }

// The single authoritative transition. Sent to the requester exactly once per
// claim. Carries
// the end state; COPIED only follows the requester's own CopyResult{COPY_OK}.
// `fence_required` is true when the requester may still have accesses in flight
// that it must prove stopped with FenceAck before the manager reuses the
// windows: every terminal state except a refusal before any grant.
message ClaimTerminal {
  uint64 claim_id = 1;
  ClaimState state = 2;     // COPIED or FAILED.
  ClaimReason reason = 3;
  bool fence_required = 4;
}

enum FenceOutcome {
  FENCE_OUTCOME_UNSPECIFIED = 0;
  // Every access to the memory has provably stopped (CUDA stream drained, disk
  // completions reaped, socket shut down and handler exited, RDMA queue pair
  // quiesced and work requests flushed). The manager may reuse the memory.
  DRAINED = 1;
  // The sender cannot establish that. The memory is quarantined: not reused
  // until the sender's process is confirmed exited, or until the manager exits.
  QUARANTINED = 2;
}

// Requester-side (or writer-side) fencing acknowledgment. Idempotent. Sent after
// ClaimTerminal/PutRefused/PutCancel resolve, once the sender's accesses to the
// claim's (or put's) windows or channel have stopped. Resolved by
// (instance_id, process_nonce, id): accepted from any current session of the same process.
message FenceAck {
  oneof subject {
    uint64 claim_id = 1;
    uint64 put_id = 2;
  }
  FenceOutcome outcome = 3;
}

// ---------------------------------------------------------------------------
// Export (manager -> source, source -> manager)
// ---------------------------------------------------------------------------

// Pin this chain for a claim. For a GPU source it is delivered to the model
// worker through poll; the worker runs the headroom check, validates and calls
// pin_checkpoint. For a host-tier source the instance's selene takes a record
// reference. The source answers with exactly one PinAck, even when it
// discards the request.
message ExportRequest {
  uint64 export_id = 1;
  uint64 claim_id = 2;
  Tier tier = 4;
  PrefixKey key = 5;
  uint64 begin_tokens = 7;
  bool want_row = 8;
  // The manager gives up (SOURCE_TIMEOUT) after this many ms and then sends
  // ExportCancel; a pin that completes later is released (late pin).
  uint32 pin_deadline_ms = 9;
  // The source session this request is bound to. A source whose current session
  // differs discards the request and answers PinAck{REFUSED, STALE_SOURCE}.
  uint64 session_incarnation = 10;
  // Bytes of retained staging the manager has reserved for this export (windows
  // and row). Always set for a GPU-tier export. The source computes the actual
  // size of the chain before pinning and refuses NO_WINDOWS if it exceeds this.
  // For host tiers 0 means the claim will stream.
  uint64 reserved_bytes = 11;
  // Set when the source has no shared memory with the manager (a TCP session):
  // the source connects to this transfer after PINNED and writes each window it
  // fills to it, in the direction of a put, and the manager relays the windows
  // on to the requester. No ExportFill is sent and no WindowFilled expected:
  // the windows are granted, and their checksums stated, on the channel.
  DataChannelRef channel = 12;
  // A multi-process source: the channel of each peer rank that is in channel mode.
  repeated RankChannel rank_channels = 13;
}

enum PinResult {
  PIN_RESULT_UNSPECIFIED = 0;
  PINNED = 1;
  REFUSED = 2;
}

// The answer to an ExportRequest. PINNED means: the whole chain from
// begin_tokens to the endpoint, and the endpoint row if wanted, is pinned in the
// source and will stay until the source sends ExportEnd. REFUSED carries the
// reason (NOT_FOUND, GENERATION_CHANGED, CHAIN_GAP, NO_HEADROOM, SOURCE_BUSY,
// INVALID_CLAIM) and means nothing is pinned. Sent at most once per export_id;
// duplicates are ignored.
message PinAck {
  uint64 export_id = 1;
  PinResult result = 2;
  ClaimReason refusal = 3;
  repeated Record records = 4;     // as in ClaimGranted.
  uint64 total_pages = 5;
  bool row = 6;
}

// Windows the source must fill, in index order. Sent only after PINNED. The
// manager has at most Limits.window_credits windows unreleased for one claim
// unless the claim is `retained`, in which case all windows arrive in one
// ExportFill; otherwise ExportFill messages arrive as the requester releases windows. The
// windows are in the STAGING region of the shared memory and are owned by the
// source for writing until WindowFilled.
message ExportFill {
  uint64 export_id = 1;
  repeated WindowSpec windows = 2;
}

// The source finished writing the window: its D2H or memcpy has drained (the
// source's access is over) and `page_xxh3`/`row_xxh3` are the checksums (for a
// host-tier source, the persisted ones; for a GPU source, of the bytes written). status FILL_FAILED means the source cannot continue; the manager
// fails the claim COPY_ERROR.
enum FillStatus { FILL_STATUS_UNSPECIFIED = 0; FILL_OK = 1; FILL_FAILED = 2; }
message WindowFilled {
  uint64 export_id = 1;
  uint32 index = 2;
  FillStatus status = 3;
  repeated uint64 page_xxh3 = 4;
  uint64 row_xxh3 = 5;
  bool has_row = 6;
  // A multi-process source: the slice transfer checksums of the ranks this session
  // attests (rank 0 and the peers that fill the window in shared memory). The other
  // ranks state theirs on their own channel. `page_xxh3` and `row_xxh3` are empty.
  repeated RankSums rank_sums = 7;
}

// Stop and release. Sent on any terminal state, on late pin, and when the
// requester session ends. The source discards the request if it has not started,
// otherwise lets in-flight copies drain (a started DMA is never revoked), drops
// its pin and sends ExportEnd. Idempotent; an ExportCancel for an unknown
// export_id is answered with ExportEnd{RELEASED, DRAINED}.
message ExportCancel {
  uint64 export_id = 1;
  ClaimReason reason = 2;
}

enum ExportEndStatus {
  EXPORT_END_STATUS_UNSPECIFIED = 0;
  EXPORT_COMPLETE = 1;   // every window was filled; the pin is released.
  EXPORT_RELEASED = 2;   // released before completion (cancel, refusal after ack, late pin).
  EXPORT_FAILED = 3;
}

// The source's final message for an export. It clears only the SOURCE's
// obligations, and only as `fence` says:
//  * fence DRAINED: every source access to the windows has stopped AND the
//    source's pin or record reference is released.
//  * fence QUARANTINED: the source cannot prove its copies drained. It keeps the
//    pin (a GPU checkpoint stays pinned, a host record stays referenced) until
//    its process exits, and the manager keeps the export slot and the windows
//    the source may still write out of service.
// It says nothing about the requester, which may still be reading a window; the
// manager reclaims a window only after every party that held it has drained.
// Sent exactly once per
// ExportRequest that was answered PINNED or discarded after being pinned. After
// PinAck{REFUSED} the source sends no ExportEnd. Idempotent; resolved by
// export_id and accepted from any current session of the same process.
message ExportEnd {
  uint64 export_id = 1;
  ExportEndStatus status = 2;
  FenceOutcome fence = 3;
}

// ---------------------------------------------------------------------------
// Put: spill a record into the manager's store (eviction to local or remote NVMe)
// ---------------------------------------------------------------------------

// Same flow and reasons as v1 Put, with windows or the data channel.
enum Reason {
  REASON_UNSPECIFIED = 0;
  PRESENT = 1;     // already stored and committed: a successful deduplication.
  INFLIGHT = 2;    // a put for the same key is running.
  BUDGET = 3;      // out of write budget or full: the writer advances the record to the next tier now; no retry loop.
  OVERSIZE = 4;    // can never fit; do not retry.
  INVALID = 6;
  QUEUE = 7;       // max_open_puts reached.
  IO = 8;          // a manager device error; the manager is unhealthy.
  PUT_NOT_READY = 9;
}
// BUDGET and "full" are the writer's cue to advance the record to the next
// configured tier immediately, not to wait (PROTOCOL.md section 11).

message PutBegin {
  uint64 put_id = 1;
  PrefixKey key = 2;
  // Pages of the whole chain up to key, and whether the record has a row.
  uint64 chain_pages = 3;
  bool row = 4;
  bool has_published_parent = 5;
  PrefixKey published_parent = 6;
  bytes bucket = 7;
  uint64 published_tail_pages = 8;
  CopyMode mode = 9;
}

message PutAccept {
  uint64 put_id = 1;
  // The parent the manager chose (may be older than the published one) and the
  // first page of the record it needs.
  uint64 first_page = 2;
  bool has_parent = 3;
  PrefixKey parent = 4;
  uint64 record_bytes = 5;
  DataChannelRef channel = 6;      // DATA_CHANNEL only.
  // A multi-process writer: the channel of each peer rank that is in channel mode.
  repeated RankChannel rank_channels = 7;
}

// A window to fill, STAGING or ARENA region. At most Limits.window_credits
// unfilled at once. Unfilled windows stay leased to the writer until FenceAck
// for the put, because the writer may still be writing.
message PutGrant {
  uint64 put_id = 1;
  WindowSpec window = 2;
}

message PutFilled {
  uint64 put_id = 1;
  uint32 index = 2;
  repeated uint64 page_xxh3 = 3;
  uint64 row_xxh3 = 4;
  bool has_row = 5;
  // A multi-process writer: as WindowFilled.rank_sums.
  repeated RankSums rank_sums = 6;
}

// Concatenated in offset order, the first 4096 bytes are the record header and
// the rest is the padded checksum segment (the persisted checksums later served
// to requesters). Sent once, after every window is filled; after it the put runs
// to Stored or PutRefused. Before indexing, the manager MUST validate the
// metadata against the accepted geometry, model identity and layout fingerprint,
// the accepted parent and first page, the byte length, and
// the checksums it verified over the received payload; any mismatch is
// PutRefused{INVALID}.
message PutCommit {
  uint64 put_id = 1;
  uint64 metadata_offset = 2;
  bytes metadata = 3;
}

// Only before PutCommit. Leaves windows leased until FenceAck{put_id}.
message PutCancel { uint64 put_id = 1; }

// The record is committed in the manager's store: durable if the manager says so,
// checksummed and indexed. Only now may the writer's lower-level copy be dropped
// ("already held means committed").
message Stored {
  uint64 put_id = 1;
  uint64 bytes = 2;
}

message PutRefused {
  uint64 put_id = 1;
  Reason reason = 2;
  string detail = 3;
}

// ---------------------------------------------------------------------------
// Rank agents: instances whose tensor-parallel ranks are separate processes
// ---------------------------------------------------------------------------
//
// Rank 0 opens the one Session (OpenSession.rank_secret set) and decides
// everything. Each other rank runs an agent that attaches with `Rank` and moves
// only its own slice of every window: the slice of rank r of page i of a window is
// at i * page_record_bytes + (the sum of the padded rank sizes before r), as
// Geometry.ranks lays out a record. Records at rest are the ordinary composite
// records (one checksum per page, one for the row): slices exist only in flight,
// with transfer checksums (RankSums) the manager computes or verifies.
//
// An agent is in shared mode (it reads and writes the manager's shared windows in
// place; window coordinates reach it through rank 0) or channel mode (its own data
// channel, named in a `rank_channels` entry). The manager decides from the
// connection (RankAttached.mode). Obligations belong to the agent's own identity
// (instance_id, agent_nonce), never to "rank r": a replacement attachment
// inherits and clears nothing.

// Transfer checksums of one rank's slice of a window. Never stored.
message RankSums {
  uint32 rank = 1;
  repeated uint64 page_xxh3 = 2;   // one per page of the window, in order.
  uint64 row_xxh3 = 3;
  bool has_row = 4;
}

// A peer rank's data channel for one transfer. Rank 0's is the message's own `channel`.
message RankChannel {
  uint32 rank = 1;
  DataChannelRef channel = 2;
}

enum RankMode {
  RANK_MODE_UNSPECIFIED = 0;
  RANK_SHARED = 1;
  RANK_CHANNEL = 2;
}

enum RankAttachStatus {
  RANK_ATTACH_STATUS_UNSPECIFIED = 0;
  RANK_OK = 1;
  RANK_STALE_MANAGER = 2;
  RANK_NO_SESSION = 3;            // rank 0 has not opened (or was superseded): retry with backoff.
  RANK_BAD_SECRET = 4;
  RANK_BAD_RANK = 5;              // out of range, or held by another live agent.
  RANK_NO_DATA_LISTENER = 6;            // channel mode is required but the manager serves no data listener.
}

message RankClientMessage {
  oneof m {
    RankAttach attach = 1;
    RankFence fence = 2;
    RankGoodbye goodbye = 3;
  }
}

message RankAttach {
  uint64 manager_incarnation = 1;
  bytes instance_id = 2;       // rank 0's.
  bytes rank0_nonce = 3;       // rank 0's process_nonce.
  uint32 rank = 4;             // 1 .. ranks-1.
  bytes agent_nonce = 5;       // 16 random bytes, fresh per agent process.
  bytes rank_secret = 6;
}

// The agent's own drain attestation for one transfer. The only thing besides
// RankGoodbye{quiesced} and the process's exit that clears this agent's
// obligations on shared windows.
message RankFence {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    CLAIM = 1;    // id = claim_id of rank 0's session
    EXPORT = 2;   // id = export_id
    PUT = 3;      // id = put_id of rank 0's session
  }
  Kind kind = 1;
  uint64 id = 2;
  FenceOutcome outcome = 3;
}

message RankGoodbye { bool quiesced = 1; }

message RankServerMessage {
  oneof m {
    RankAttached attached = 1;
    RankClosing closing = 2;
  }
}

message RankAttached {
  RankAttachStatus status = 1;
  // Assigned from the session-incarnation counter. A transfer is bound to it.
  uint64 generation = 2;
  RankMode mode = 3;
}

// The agent must stop work, drain, send its RankFences and RankGoodbye, and end.
message RankClosing {
  ClosingReason reason = 1;
  string detail = 2;
}
