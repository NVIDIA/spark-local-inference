[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignition"
version = "0.1.0"
description = "Python model preparation for the Helios CUDA graph serving core"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "helios/licenses/PyTorch.txt", "ignition/recipes/deepseek41/assets/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ignition = "ignition.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9,<10", "tiktoken>=0.12,<1"]
api-test = ["pytest>=9,<10", "openai>=2,<3", "anthropic>=0.70,<1"]
prepare = [
    "cryptography>=46,<52",
    "torch==2.14.1+cu132",
    "torchvision==0.29.1+cu132",
    "transformers[torch,vision,chat_template] @ git+https://github.com/huggingface/transformers.git@1d9654e78a23fb167ef539cbd699dfbd3e4830cf",
    "flashinfer-python[b12x] @ git+https://github.com/local-inference-lab/flashinfer.git@ddbe93fc488d9342f0a7dea810bff323fc6509b3",
    "cuda-python==13.3.1",
    "cuda-tile[tileiras]==1.6.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "huggingface-hub==1.33.0",
    "accelerate==1.14.0",
    "Pillow==12.3.0",
    "flare-heliopause",
    "protobuf>=7.35.1,<8",
    "rich>=13",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
flare-heliopause = { path = "heliopause" }

[tool.setuptools.packages.find]
include = ["ignition*"]

[tool.setuptools.package-data]
"ignition.preparation" = ["ladders/*.json"]
"ignition.patches" = ["*.patch"]
"ignition.recipes.deepseek41" = ["assets/*"]
"ignition.recipes.deepseek4" = ["assets/*"]
"ignition.recipes.gemma4" = ["assets/*"]
"ignition.recipes.kimi3" = ["assets/*"]
"ignition.recipes.glm53" = ["assets/*"]
"ignition.recipes.mimo_v2" = ["assets/*"]
"ignition.recipes.nemotron_h" = ["assets/*"]
"ignition.recipes.qwen38" = ["assets/*"]
"ignition.recipes.step5" = ["assets/*"]
"ignition.recipes.muse_spark" = ["assets/*"]
"ignition.recipes.minimax_m3" = ["assets/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
