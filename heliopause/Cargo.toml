[package]
name = "flare-heliopause"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false
# Maturin includes only the embedded recipe assets from this link.
exclude = ["ignition"]

[lib]
name = "flare_heliopause"
crate-type = ["cdylib"]

[features]
default = ["server"]
server = ["helios-core/server"]
qualification = []
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "0.22.1"
helios-core = { package = "flare-helios", path = "../helios", features = ["runtime-package", "frontend"] }
pyo3 = { version = "0.28.3" }
libc = "0.2.189"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
prost = "0.14"
prost-reflect = { version = "0.16.5", features = ["serde"] }
libloading = "0.8.9"
ring = "0.17.14"
openssl-sys = "0.9"
tempfile = "3.27"
sha2 = "0.10.9"
rayon = "1.11"

[target.'cfg(not(windows))'.dependencies]
openssl = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.11"

# sha2 0.10 gates ARM SHA-256 instructions behind its asm feature.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-src = { version = "300", features = ["legacy"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
helios-core = { package = "flare-helios", path = "../helios", features = ["runtime-package", "test-tools"] }
