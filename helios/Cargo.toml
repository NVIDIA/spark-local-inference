[package]
name = "flare-helios"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "flare_helios"
crate-type = ["rlib"]

[features]
default = []
test-tools = []
runtime-package = ["dep:serde", "dep:serde_json", "dep:prost", "dep:prost-build", "dep:ring", "dep:zstd"]
frontend = ["dep:serde", "dep:tokenizers", "dep:serde_json", "dep:sha2", "dep:ryu", "dep:deepseek-recipe-core", "dep:deepseek-recipe-encoding"]
images = ["frontend", "dep:png", "dep:turbojpeg", "dep:image-webp"]
grammar = ["frontend", "dep:llguidance"]
server = ["dep:serde", "images", "grammar", "dep:axum", "dep:tokio", "dep:async-stream", "dep:base64", "dep:ratatui", "dep:crossterm", "dep:futures-util", "dep:flate2", "dep:zstd", "dep:brotli", "dep:httpdate", "dep:deepseek-recipe"]
# RoCEnante's RDMA proxy for ranks on separate hosts; links libibverbs.
roce = ["dep:cc", "runtime-package"]
# Lets the prefix cache pool's data channel use RDMA when its manager offers it (experimental);
# links libibverbs.
rdma = ["flare-selene/rdma"]

[dependencies]
flare-eos = { path = "../eos" }
deepseek-recipe = { git = "https://github.com/local-inference-lab/deepseek-recipe", rev = "6d09e9be68dbf4ae488f6b22ee9114dcf9ea6270", optional = true }
deepseek-recipe-core = { git = "https://github.com/local-inference-lab/deepseek-recipe", rev = "6d09e9be68dbf4ae488f6b22ee9114dcf9ea6270", optional = true }
deepseek-recipe-encoding = { git = "https://github.com/local-inference-lab/deepseek-recipe", rev = "6d09e9be68dbf4ae488f6b22ee9114dcf9ea6270", optional = true }
httpdate = { version = "1.0", optional = true }
futures-util = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
brotli = { version = "8", optional = true }
ring = { version = "0.17.14", optional = true }
thiserror = "2.0"
flare-selene = { path = "../selene" }
serde = { version = "1.0", features = ["derive"], optional = true }
prost = { version = "0.14", optional = true }
blake2 = "0.10"
libloading = "0.8.9"
libc = "0.2.189"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"], optional = true }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "raw_value"], optional = true }
sha2 = { version = "0.10.9", optional = true }
ryu = { version = "1.0", optional = true }
png = { version = "0.18.1", optional = true }
image-webp = { version = "0.2.4", optional = true }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "multipart"], optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros"], optional = true }
async-stream = { version = "0.3.6", optional = true }
base64 = { version = "0.22.1", optional = true }
llguidance = { version = "=1.9.1", default-features = false, features = ["lark", "referencing", "ahash", "jsonschema_validation"], optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", default-features = false, optional = true }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }

[dev-dependencies]
flare-selene = { path = "../selene", features = ["test-support"] }
minijinja = { version = "=2.24.0", features = ["loader", "preserve_order", "loop_controls"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }

# The pool tests drive a real Selene manager over a Unix-domain socket, so the
# dependency and its one consumer stay Unix-only; declaring it unconditionally
# made the whole test profile uncompilable on Windows.
[target.'cfg(unix)'.dev-dependencies]
flare-selene-manager = { path = "../selene-manager", features = ["test-support"] }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
cc = { version = "1.6", optional = true }

[[bench]]
name = "template"
harness = false
required-features = ["frontend"]

[[bin]]
name = "test_fixed_runtime_package"
path = "tests/tools/test_fixed_runtime_package.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_runtime_package"
path = "tests/tools/test_runtime_package.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_frontend"
path = "tests/tools/test_frontend.rs"
required-features = ["frontend", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_images"
path = "tests/tools/test_images.rs"
required-features = ["images", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_requests"
path = "tests/tools/test_requests.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_deepseek4_images"
path = "tests/tools/test_deepseek4_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_mimo_images"
path = "tests/tools/test_mimo_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_package_protection"
path = "tests/tools/test_package_protection.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

# sha2 0.10 gates ARM SHA-256 instructions behind its asm feature.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"], optional = true }

[[bin]]
name = "test_kimi3_images"
path = "tests/tools/test_kimi3_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_step_images"
path = "tests/tools/test_step_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_radio_images"
path = "tests/tools/test_radio_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false
