// Payload-based prepared-model packages: signed payload identities and execution metadata,
// unsigned physical placement.
//
// This file defines the semantic schema only. Physical container placement (which safetensors
// file and tensor holds a payload) lives in `LocationSet`, which is deliberately unsigned.
// Execution, contract, frontend, and engine types are declared once in `runtime_package.proto`
// and referenced here directly.

syntax = "proto3";
package flare.package;

import "runtime_package.proto";

// Stored bytes identified by content. The digest covers the exact stored payload bytes and
// nothing about the container that holds them.
message PayloadDescriptor {
  bytes id = 1; // SHA-256 over the exact stored bytes.
  uint64 nbytes = 2;
}

enum PayloadRole {
  PAYLOAD_ROLE_UNSPECIFIED = 0;
  PAYLOAD_ROLE_WEIGHTS = 1;
  PAYLOAD_ROLE_TUNED_WEIGHTS = 2;
  PAYLOAD_ROLE_INITIAL_STATE = 3;
  PAYLOAD_ROLE_KERNELS = 4;
  PAYLOAD_ROLE_GRAPHS = 5;
  PAYLOAD_ROLE_FRONTEND = 6;
}

// One contiguous range of one payload. A subrange of a larger payload is a slice, so several
// consumers may share stored bytes; a slice never names a file or a logical offset.
message PayloadSlice {
  bytes payload_id = 1;
  uint64 offset = 2;
  uint64 nbytes = 3;
}

// One authenticated use of a slice. Roles belong to uses, not to content identity.
message PayloadUse {
  PayloadSlice slice = 1;
  PayloadRole role = 2;
}

// Unsigned physical placement: which container file holds which payload. Empty `file` names the
// primary. Names are locators, never identities, and are validated before use.
message PayloadLocation {
  bytes payload_id = 1;
  string file = 2;
  string tensor = 3;
}

message LocationSet {
  uint32 version = 1;
  repeated PayloadLocation locations = 2;
  // Hints only. Selection comes from the caller; readiness re-validates the closure.
  repeated string available_deployments = 3;
}

// Unsigned acquisition hints for signed targets. Every completed output must match the signed
// target length and digest before installation.
message DerivationSet { uint32 version = 1; repeated Derivation derivations = 2; }

message Derivation {
  bytes target_payload_id = 1;
  repeated DerivationOperation operations = 2;
}

message DerivationOperation {
  oneof operation {
    DerivationCopy copy = 1;
    DerivationFill fill = 2;
  }
}

// A contiguous run repeated over up to two strided outer axes: three dimensions in total.
message DerivationCopy {
  bytes source_payload_id = 1;
  uint64 source_offset = 2;
  uint64 destination_offset = 3;
  uint64 contiguous_bytes = 4;
  repeated uint64 extents = 5;
  repeated uint64 source_strides = 6;
  repeated uint64 destination_strides = 7;
}

message DerivationFill {
  uint64 destination_offset = 1;
  uint64 byte_length = 2;
  bytes pattern = 3;
}

// ---------------------------------------------------------------- signed bodies

message PublisherMetadata {
  string namespace = 1;
  string official_source = 2;
  bool development = 3;
  string license_name = 4;
  string license_link = 5;
  uint32 ranks = 6;
}

message FrontendAsset {
  string name = 1;
  PayloadUse payload = 2;
  bytes sha256 = 3; // SHA-256 of the payload bytes, for direct comparison after reads.
}

message DeploymentCommitment {
  string deployment_id = 1;
  bytes body_digest = 2; // SHA-256 over the exact serialized DeploymentBody.
}

message RankCommitment {
  uint32 rank = 1;
  bytes body_digest = 2; // SHA-256 over the exact serialized RankBody.
}

// Group 1: what every deployment shares. Serving capacities, engine partitions, peer topology,
// cluster membership, and rebuild metadata are deployment-scoped because tensor parallelism and
// captured capacities vary between deployments.
message PackageBody {
  uint32 format_version = 1;
  bytes package_id = 2; // 32 bytes, identifies the signed package.
  string model_identity = 3;
  string hardware_identity = 4;
  PublisherMetadata publisher = 5;
  flare.runtime.FrontendSettings frontend = 6;
  flare.runtime.DefaultSamplingParameters sampling_defaults = 7;
  repeated PayloadDescriptor payloads = 8; // shared frontend payload lengths.
  repeated FrontendAsset assets = 9;
  repeated DeploymentCommitment deployments = 10;
}

// One prepared deployment: one tensor-parallel topology on one hardware target.
message DeploymentBody {
  string deployment_id = 1;
  repeated int32 architecture = 2;
  uint32 tensor_parallel = 3;
  flare.runtime.ServingContract contract = 4;
  flare.runtime.Cluster cluster = 5;
  flare.runtime.RebuildManifest rebuild = 6;
  Engram engram = 7;
  repeated PayloadDescriptor payloads = 8; // deployment-scoped payload lengths.
  repeated RankCommitment ranks = 9;
}

// One native rank of one deployment: placement, initialization, and execution geometry.
message RankBody {
  uint32 rank = 1;
  string deployment_id = 2;
  flare.runtime.Context context = 3;
  repeated flare.runtime.Reservation reservations = 4;
  repeated Allocation allocations = 5;
  repeated Initializer initializers = 6;
  repeated PayloadDescriptor payloads = 7; // rank-scoped payload lengths.
  repeated ExecutableResource resources = 8;
  repeated Module modules = 9;
  repeated Function functions = 10;
  repeated Graph graphs = 11;
  repeated string events = 12;
  repeated flare.runtime.PeerMemory peers = 13;
  flare.runtime.Execution execution = 14;
  flare.runtime.RoceTransport roce = 15;
  PreparedWeightCatalog prepared_weights = 16;
}

message Allocation {
  string name = 1;
  uint64 nbytes = 2;
  uint64 alignment = 3;
  optional uint64 address = 4;
  flare.runtime.Memory memory = 5;
  optional flare.runtime.Sizing sizing = 6;
  repeated flare.runtime.Relocation relocations = 7;
}

// One contiguous destination range filled from a payload subrange. Several initializers may
// write one allocation; destinations must be disjoint and inside it.
message Initializer {
  string allocation = 1;
  uint64 destination_offset = 2;
  PayloadUse source = 3;
}

enum ExecutableKind {
  EXECUTABLE_KIND_UNSPECIFIED = 0;
  EXECUTABLE_KIND_CUBIN = 1;
  EXECUTABLE_KIND_GRAPH = 2;
}

// One independently compressed zstd executable frame. Resource IDs are unique across ranks.
message ExecutableResource {
  uint64 resource_id = 1;
  ExecutableKind kind = 2;
  PayloadSlice stored = 3;
  uint64 decoded_nbytes = 4;
  uint32 chunk_nbytes = 5;
  repeated bytes chunk_sha256 = 6; // SHA-256 of each stored compressed chunk.
}

message Module {
  string name = 1;
  uint32 cubin = 2; // index into RankBody.resources
  repeated ModuleGlobal globals = 3;
}

// Initialized plaintext module data. Not an executable resource: it is authenticated state that
// the loader copies into a module symbol after loading the cubin.
message ModuleGlobal {
  string symbol = 1;
  uint64 nbytes = 2;
  PayloadUse contents = 3;
  repeated flare.runtime.Relocation relocations = 4;
}

message Function {
  string module = 1;
  string symbol = 2;
  repeated uint64 parameter_sizes = 3;
  repeated flare.runtime.FunctionAttribute attributes = 4;
}

message Graph {
  string name = 1;
  uint64 flags = 2;
  uint32 resource = 3; // index into RankBody.resources
  uint64 node_count = 4;
  uint64 edge_count = 5;
  repeated uint64 functions = 6;
}

// ---------------------------------------------------------------- engine tables

// Offloaded n-gram tables. This mirrors `flare.runtime.Engram` field for field, replacing the
// logical payload `Span` with a `PayloadUse` slice. Table partitions are per deployment because
// they are owned by individual TP ranks.
message Engram {
  // Raw token ID to normalized vocabulary ID; normalization runs only during preparation.
  repeated uint32 token_map = 1;
  uint32 pad_token_id = 2;
  uint32 compressed_vocabulary = 3;
  repeated EngramTable tables = 4;
}

message EngramTable {
  enum Encoding {
    UNSPECIFIED = 0;
    FP8_E4M3_E8M0 = 1;
    NVFP4_E4M3_GLOBAL = 2;
    TRELLIS_K4_E4M3_E8M0 = 3;
  }
  uint32 layer = 1;
  uint64 rows = 2;
  uint32 embedding_width = 3;
  uint32 scale_block = 4;
  // Row-major planes held by payload slices.
  PayloadUse weights = 5;
  PayloadUse scales = 6;
  EngramHash hash = 7;
  string weight_buffer = 8;
  string scale_buffer = 9;
  string hash_buffer = 10;
  string ready_event = 11;
  Encoding encoding = 12;
  // Mapped host int64 row IDs followed by the release-published submission sequence.
  string request_buffer = 13;
  float global_scale = 14;
  // Disjoint row partitions owned by individual TP ranks. Empty retains the shared
  // weights/scales planes above. Partitioned tables publish partition-local row IDs.
  repeated EngramTableShard shards = 15;
}

message EngramTableShard {
  uint32 rank = 1;
  uint64 first_row = 2;
  uint64 rows = 3;
  PayloadUse weights = 4;
  PayloadUse scales = 5;
}

message EngramHash {
  enum Method { UNSPECIFIED = 0; XOR_MODULO = 1; EOS_XOR_MODULO = 2; }
  Method method = 1;
  // One order, modulus, and row offset per lookup head, in output-column order.
  repeated uint32 orders = 2;
  // Multipliers by lag: current token first, then preceding tokens. Missing history uses pad_token_id.
  repeated uint64 multipliers = 3;
  repeated uint64 primes = 4;
  repeated uint64 offsets = 5;
}

// --------------------------------------------------- prepared weight provenance

// Combiner input. Helios serving ignores this catalog.
message PreparedWeightCatalog {
  uint32 version = 1;
  repeated PreparedWeightView views = 2;
  repeated string unavailable = 3;
}

message PreparedWeightView {
  string name = 1;
  string group = 2;
  string dtype = 3;
  uint32 element_bytes = 4;
  repeated uint64 shape = 5;
  repeated uint64 stride = 6;
  string layout_type = 7;
  uint64 allocation = 8; // index into RankBody.allocations
  uint64 offset = 9;
  uint64 nbytes = 10;
  PackingParameters packing = 11;
  repeated WeightSource sources = 12;
  repeated WeightPadding padding = 13;
  string statistics_domain = 14;
}

message PackingParameters {
  string format = 1;
  uint64 block_size = 2;
  uint64 group_size = 3;
  uint64 scale_atom_rows = 4;
  uint64 tile_order = 5;
  uint64 row_rotation = 6;
  uint64 locality_tile = 7;
}

message WeightSource {
  string tensor = 1;
  repeated TensorRange ranges = 2;
  uint32 concatenation_axis = 3;
  repeated WeightPiece pieces = 4;
  // Empty preserves raw checkpoint byte coordinates. A bounded canonical
  // encoding name makes source offsets refer to an encoded tile grid; Helios
  // never executes the encoding.
  string piece_encoding = 5;
}

// One affine copy of unchanged checkpoint bytes. `extents` and both stride
// arrays describe outer axes; `contiguous_bytes` is the innermost run. Offsets
// are raw checkpoint and retained-owner bytes respectively. Empty `pieces` on a
// WeightSource retains the legacy single-source semantics.
message WeightPiece {
  uint64 source_offset = 1;
  uint64 destination_offset = 2;
  uint64 contiguous_bytes = 3;
  repeated uint64 extents = 4;
  repeated uint64 source_strides = 5;
  repeated uint64 destination_strides = 6;
}

message TensorRange {
  uint64 begin = 1;
  uint64 end = 2;
}

message WeightPadding {
  uint64 offset = 1;
  uint64 nbytes = 2;
  bytes fill = 3;
}

// --------------------------------------------------------------------- envelope

// `flare.manifest`. Each body is signed over its exact serialized bytes; parent commitments bind
// child bodies by digest, so verification never parses and reserializes before checking.
message ProtectedPackage {
  uint32 version = 1;      // 2
  bytes package_id = 2;    // 32 bytes, repeated from the signed package body.
  // SHA-256 of the signer's Ed25519 public key, as in the previous envelope. The verification key
  // is not embedded: callers resolve it from publisher profiles, and namespace acceptance and
  // revocation remain their authority.
  bytes signer = 3;        // 32 bytes.
  bytes package_body = 4;
  bytes package_signature = 5;
  repeated SignedDeployment deployments = 6;
  repeated SignedRank ranks = 7;
}

message SignedDeployment {
  uint32 index = 1; // position in PackageBody.deployments
  bytes body = 2;
  bytes signature = 3;
}

message SignedRank {
  uint32 deployment = 1; // position in ProtectedPackage.deployments
  uint32 rank = 2;       // rank id inside that deployment
  bytes body = 3;
  bytes signature = 4;
}
